<!DOCTYPE html>
<html>
<head>
<title>YouTube Clone</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;color:#222}
header{height:60px;display:flex;align-items:center;padding:0 25px;border-bottom:1px solid #ddd;gap:30px}
.logo{font-size:22px;font-weight:bold;color:red}.search{width:50%;padding:10px;border:1px solid #ccc}
nav{width:220px;position:fixed;top:60px;bottom:0;padding:20px;background:#fff}
nav p{padding:10px;margin:5px}.active{background:#eee}
main{margin-left:240px;padding:25px}.tags{display:flex;gap:12px;margin-bottom:30px}
.tags span{padding:9px 18px;background:#eee;border-radius:20px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:25px}
.card img{width:100%;height:145px;object-fit:cover}.card h3{font-size:15px;margin:10px 0 6px}
.card p{font-size:13px;color:#666}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}nav{width:170px}main{margin-left:180px}}
</style>
</head>

<body>
<header><b>☰</b><div class="logo">▶ YouTube</div><input class="search" placeholder="Search"> 🔍 🎤</header>

<nav>
<p class="active">🏠 Home</p><p>🧭 Explore</p><p>📺 Subscriptions</p><hr>
<p>📚 Library</p><p>🕘 History</p><p>▶ Your videos</p><p>⏰ Watch later</p><p>👍 Liked videos</p>
</nav>

<main>
<div class="tags"><span>All</span><span>Music</span><span>Mixes</span><span>UI Design</span><span>Nollywood</span><span>Logos</span><span>Website</span><span>Computer Science</span></div>

<div class="grid">
<script>
let videos=[
["https://images.unsplash.com/photo-1559757175-0eb30cd8c063","Medical Doctor Degree"],
["https://images.unsplash.com/photo-1558655146-9f40138edfeb","UI Design Trends 2021"],
["https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f","Official Music Video"],
["https://images.unsplash.com/photo-1551836022-d5d88e9218df","Data Analyst Career"],
["https://images.unsplash.com/photo-1529156069898-49953e39b3ac","Stubborn Billionaires"],
["https://images.unsplash.com/photo-1534528741775-53994a69daeb","Talk Show"],
["https://images.unsplash.com/photo-1561070791-2526d30994b5","Complete Brand Identity"],
["https://images.unsplash.com/photo-1506794778202-cad84cf45f1d","7 Mistakes Ladies Make"]
];
videos.forEach(v=>document.write(`<div class="card"><img src="${v[0]}"><h3>${v[1]}</h3><p>Channel Name • 56K views • 1 month ago</p></div>`));
</script>
</div>
</main>
</body>
</html>
